# Her push ve pull request'te lint, tip kontrolü, testler ve derleme otomatik çalışır.
# Sonuç GitHub'da commit'in yanında ✓ / ✗ olarak görünür.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint · tip · test · derleme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Entegrasyon testleri gerçek PostgreSQL'e karşı çalışır.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yerlem
          POSTGRES_PASSWORD: yerlem
          POSTGRES_DB: yerlem
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yerlem"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://yerlem:yerlem@localhost:5432/yerlem_test
      - run: npm run build

  frontend:
    name: Frontend (lint · tip · test · derleme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker imajları derleniyor mu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
