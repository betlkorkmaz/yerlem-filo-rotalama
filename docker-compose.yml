services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yerlem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yerlem}
      POSTGRES_DB: ${POSTGRES_DB:-yerlem}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Yerel geliştirmede (npm run dev) backend'in veritabanına bağlanabilmesi için.
    ports:
      - "${DB_PORT:-5432}:5432"
    # Backend, veritabanı bağlantı kabul etmeye başlamadan açılmasın diye sağlık kontrolü.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-yerlem}:${POSTGRES_PASSWORD:-yerlem}@db:5432/${POSTGRES_DB:-yerlem}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      OSRM_TIMEOUT_MS: ${OSRM_TIMEOUT_MS:-8000}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    # Migration ve seed bitip API dinlemeye başlayınca "sağlıklı" sayılır.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    # Arayüz, API hazır olmadan açılırsa ilk istekler hata verir; bu yüzden backend'in sağlıklı olması beklenir.
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db-data:
