server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API istekleri aynı adres üzerinden backend konteynerine aktarılır; CORS ayarı gerekmez.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Backend kapalıysa kullanıcı uzun süre beklemesin; bağlantı kısa sürede kesilir.
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    # Backend'e hiç ulaşılamazsa nginx'in HTML hata sayfası yerine API ile aynı biçimde JSON döner.
    # proxy_intercept_errors bilerek kapalı: backend'in kendi 502/504 cevapları (ör. rota servisi
    # hatası) olduğu gibi iletilmeli, bu blok yalnızca nginx'in ürettiği hataları yakalar.
    error_page 502 504 = @backend_unavailable;
  }

  location @backend_unavailable {
    default_type application/json;
    return 503 '{"error":{"code":"BACKEND_UNAVAILABLE","message":"Sunucuya şu anda ulaşılamıyor. Lütfen biraz sonra tekrar deneyin."}}';
  }

  # Tek sayfa uygulama: /vehicles/123 gibi adresler yenilendiğinde de index.html dönmeli.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
