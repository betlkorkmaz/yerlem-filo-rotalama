server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API istekleri aynı adres üzerinden backend konteynerine aktarılır; CORS ayarı gerekmez.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # Tek sayfa uygulama: /vehicles/123 gibi adresler yenilendiğinde de index.html dönmeli.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
